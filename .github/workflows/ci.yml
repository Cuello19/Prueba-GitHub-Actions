name: QA Shift-Left and Shift-Right Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests (Shift-Left)
        run: pytest tests/unit

      - name: Run Integration Tests (Shift-Left)
        run: pytest tests/integration

  deploy-to-staging:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Deploy to Staging Environment
        run: echo "Desplegando a entorno de staging..."

      - name: Run Health Check
        run: curl -f http://staging.example.com/health || exit 1

      - name: Run Smoke Tests in Staging
        run: pytest tests/smoke

  monitor-production:
    needs: deploy-to-staging
    runs-on: ubuntu-latest
    steps:
      - name: Simulate Production Error and Send to Sentry
        run: |
          echo "Simulando error en producción..."
          python simulate_error.py

      - name: Confirm Monitoring Activated
        run: echo "Verificar que Sentry recibió la alerta."
